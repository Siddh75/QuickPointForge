[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quickpointforge"
version = "0.1.0"
description = "Simulate a LiDAR-style scan from 3D Gaussian Splat centers via spherical binning (no ray-casting), with a desktop UI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Siddharth Gupta" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "open3d>=0.18",
    "plyfile>=1.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
quickpointforge-gui = "quickpointforge.app:main"

[tool.setuptools.packages.find]
include = ["quickpointforge*"]
